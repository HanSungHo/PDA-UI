stages:
  - prepare
  - quality
  - test
  - build

variables:
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'
  NPM_CONFIG_PREFER_OFFLINE: 'true'
  NO_COLOR: '1'

.node-job:
  image:
    name: node:22-bookworm-slim
    pull_policy: if-not-present
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - npm ci --prefer-offline --no-audit

install:
  extends: .node-job
  stage: prepare
  cache:
    policy: pull-push
  script:
    - node --version
    - npm --version

lint:
  extends: .node-job
  stage: quality
  script:
    - npm run lint:check

type-check:
  extends: .node-job
  stage: quality
  script:
    - npm run type-check

test:
  extends: .node-job
  stage: test
  script:
    - npm run test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

build:
  extends: .node-job
  stage: build
  script:
    - npm run build:prod

sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
