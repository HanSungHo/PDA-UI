<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Component - Breadcrumbs</title>
    <style>
      /* ============================================
       RESET & BASE
    ============================================ */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--family-font-family-default);
        background: #f3f4f6;
        color: #030712;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ============================================
       PAGE LAYOUT
    ============================================ */
      .page-wrapper {
        max-width: 620px;
        margin: 40px auto;
      }

      /* ============================================
       HEADER - Parent Page Navigation
    ============================================ */
      .header {
        background: #f9fafb;
        border-radius: 16px 16px 0 0;
        padding: 40px 32px;
      }

      .header-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
      }

      .header-nav-link {
        font-size: 14px;
        font-weight: 400;
        line-height: 20px;
        color: #6b7280;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.2s;
      }

      .header-nav-link:hover {
        color: #030712;
      }

      .header-nav-arrow {
        font-size: 14px;
        color: #6b7280;
      }

      .header-title {
        font-size: 36px;
        font-weight: 800;
        line-height: 40px;
        color: #030712;
        letter-spacing: -0.02em;
      }

      /* ============================================
       CONTAINER
    ============================================ */
      .container {
        background: #ffffff;
        border-radius: 0 0 16px 16px;
        padding: 80px 32px;
        display: flex;
        flex-direction: column;
        gap: 48px;
      }

      /* ============================================
       SECTION
    ============================================ */
      .section-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 24px;
      }

      /* ============================================
       BREADCRUMB ITEM VARIANTS
    ============================================ */

      /* --- Item_breadcrumbs Base (Status=Default) --- */
      .breadcrumb-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
        border-radius: 8px;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .breadcrumb-item:hover {
        background-color: #f3f4f6;
      }

      .breadcrumb-item-icon {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
      }

      .breadcrumb-item-label {
        font-size: 12px;
        font-weight: 400;
        line-height: 12px;
        color: #6a7282;
        white-space: nowrap;
      }

      /* --- Status=Active --- */
      .breadcrumb-item-active {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
        border-radius: 0;
        cursor: default;
      }

      .breadcrumb-item-active .breadcrumb-item-label {
        font-size: 12px;
        font-weight: 600;
        line-height: 16px;
        color: #030712;
      }

      /* --- Status=Space (Separator) --- */
      .breadcrumb-separator {
        font-size: 12px;
        font-weight: 400;
        line-height: 12px;
        color: #6a7282;
        padding: 2px 0;
        user-select: none;
      }

      /* ============================================
       BREADCRUMBS COMPONENT
    ============================================ */
      .breadcrumbs {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 0;
      }

      /* --- Home Icon --- */
      .breadcrumbs-home-icon {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .breadcrumbs-home-icon svg {
        width: 12px;
        height: 12px;
      }

      /* ============================================
       SHOWCASE BOXES (dashed purple border)
    ============================================ */
      .item-showcase {
        border: 1.5px dashed #a78bfa;
        border-radius: 12px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .breadcrumbs-showcase {
        border: 1.5px dashed #a78bfa;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ============================================
       INTERACTIVE DEMO
    ============================================ */
      .demo-section {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 8px;
      }

      .demo-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .demo-btn {
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        color: #374151;
        cursor: pointer;
        transition: all 0.2s;
      }

      .demo-btn:hover {
        background: #f9fafb;
        border-color: #d1d5db;
      }

      .demo-btn.active {
        background: #6366f1;
        border-color: #6366f1;
        color: #fff;
      }

      .demo-label {
        font-size: 11px;
        font-weight: 500;
        color: #9ca3af;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .demo-breadcrumb-container {
        padding: 16px 20px;
        background: #f9fafb;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <!-- ============================================
       HEADER
  ============================================ -->
      <div class="header">
        <div class="header-nav">
          <a class="header-nav-link">Base Component</a>
          <span class="header-nav-arrow">→</span>
          <a class="header-nav-link" style="color: #030712; font-weight: 500">Breadcrumbs</a>
        </div>
        <h1 class="header-title">Breadcrumbs</h1>
      </div>

      <!-- ============================================
       CONTAINER
  ============================================ -->
      <div class="container">
        <!-- ==========================================
         SECTION 1: Item_breadcrumbs Variants
    ========================================== -->
        <div>
          <div class="section-title">Item_breadcrumbs Variants</div>
          <div class="item-showcase">
            <!-- Status=Default -->
            <a class="breadcrumb-item">
              <svg
                class="breadcrumb-item-icon"
                viewBox="0 0 12 12"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle cx="6" cy="6" r="5" stroke="#6A7282" stroke-width="2" fill="none" />
              </svg>
              <span class="breadcrumb-item-label">HOME</span>
            </a>

            <!-- Status=Active -->
            <span class="breadcrumb-item-active">
              <svg
                class="breadcrumb-item-icon"
                viewBox="0 0 12 12"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle cx="6" cy="6" r="5" stroke="#6A7282" stroke-width="2" fill="none" />
              </svg>
              <span class="breadcrumb-item-label">HOME</span>
            </span>

            <!-- Status=Space -->
            <span class="breadcrumb-separator">/</span>
          </div>
        </div>

        <!-- ==========================================
         SECTION 2: Breadcrumbs Levels
    ========================================== -->
        <div>
          <div class="section-title">Breadcrumbs - All Levels</div>
          <div class="breadcrumbs-showcase">
            <!-- Level=4: Home / HOME / HOME / HOME / HOME(active) -->
            <nav class="breadcrumbs" aria-label="Breadcrumb Level 4">
              <span class="breadcrumbs-home-icon">
                <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M1.5 5.26L6 1.5L10.5 5.26V9.5C10.5 9.76522 10.3946 10.0196 10.2071 10.2071C10.0196 10.3946 9.76522 10.5 9.5 10.5H2.5C2.23478 10.5 1.98043 10.3946 1.79289 10.2071C1.60536 10.0196 1.5 9.76522 1.5 9.5V5.26Z"
                    stroke="#6A7282"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M4.5 10.5V6H7.5V10.5"
                    stroke="#6A7282"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <span class="breadcrumb-separator">/</span>
              <a class="breadcrumb-item">
                <span class="breadcrumb-item-label">HOME</span>
              </a>
              <span class="breadcrumb-separator">/</span>
              <a class="breadcrumb-item">
                <span class="breadcrumb-item-label">HOME</span>
              </a>
              <span class="breadcrumb-separator">/</span>
              <a class="breadcrumb-item">
                <span class="breadcrumb-item-label">HOME</span>
              </a>
              <span class="breadcrumb-separator">/</span>
              <span class="breadcrumb-item-active">
                <span class="breadcrumb-item-label">HOME</span>
              </span>
            </nav>

            <!-- Level=3: Home / HOME / HOME / HOME(active) -->
            <nav class="breadcrumbs" aria-label="Breadcrumb Level 3">
              <span class="breadcrumbs-home-icon">
                <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M1.5 5.26L6 1.5L10.5 5.26V9.5C10.5 9.76522 10.3946 10.0196 10.2071 10.2071C10.0196 10.3946 9.76522 10.5 9.5 10.5H2.5C2.23478 10.5 1.98043 10.3946 1.79289 10.2071C1.60536 10.0196 1.5 9.76522 1.5 9.5V5.26Z"
                    stroke="#6A7282"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M4.5 10.5V6H7.5V10.5"
                    stroke="#6A7282"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <span class="breadcrumb-separator">/</span>
              <a class="breadcrumb-item">
                <span class="breadcrumb-item-label">HOME</span>
              </a>
              <span class="breadcrumb-separator">/</span>
              <a class="breadcrumb-item">
                <span class="breadcrumb-item-label">HOME</span>
              </a>
              <span class="breadcrumb-separator">/</span>
              <span class="breadcrumb-item-active">
                <span class="breadcrumb-item-label">HOME</span>
              </span>
            </nav>

            <!-- Level=2: Home / HOME / HOME(active) -->
            <nav class="breadcrumbs" aria-label="Breadcrumb Level 2">
              <span class="breadcrumbs-home-icon">
                <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M1.5 5.26L6 1.5L10.5 5.26V9.5C10.5 9.76522 10.3946 10.0196 10.2071 10.2071C10.0196 10.3946 9.76522 10.5 9.5 10.5H2.5C2.23478 10.5 1.98043 10.3946 1.79289 10.2071C1.60536 10.0196 1.5 9.76522 1.5 9.5V5.26Z"
                    stroke="#6A7282"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M4.5 10.5V6H7.5V10.5"
                    stroke="#6A7282"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <span class="breadcrumb-separator">/</span>
              <a class="breadcrumb-item">
                <span class="breadcrumb-item-label">HOME</span>
              </a>
              <span class="breadcrumb-separator">/</span>
              <span class="breadcrumb-item-active">
                <span class="breadcrumb-item-label">HOME</span>
              </span>
            </nav>

            <!-- Level=1: Home / HOME(active) -->
            <nav class="breadcrumbs" aria-label="Breadcrumb Level 1">
              <span class="breadcrumbs-home-icon">
                <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M1.5 5.26L6 1.5L10.5 5.26V9.5C10.5 9.76522 10.3946 10.0196 10.2071 10.2071C10.0196 10.3946 9.76522 10.5 9.5 10.5H2.5C2.23478 10.5 1.98043 10.3946 1.79289 10.2071C1.60536 10.0196 1.5 9.76522 1.5 9.5V5.26Z"
                    stroke="#6A7282"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M4.5 10.5V6H7.5V10.5"
                    stroke="#6A7282"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <span class="breadcrumb-separator">/</span>
              <span class="breadcrumb-item-active">
                <span class="breadcrumb-item-label">HOME</span>
              </span>
            </nav>
          </div>
        </div>

        <!-- ==========================================
         SECTION 3: Interactive Demo
    ========================================== -->
        <div>
          <div class="section-title">Interactive Demo</div>
          <div class="demo-section">
            <div class="demo-controls">
              <span class="demo-label">Level:</span>
              <button class="demo-btn" data-level="1" onclick="setLevel(1)">1</button>
              <button class="demo-btn" data-level="2" onclick="setLevel(2)">2</button>
              <button class="demo-btn" data-level="3" onclick="setLevel(3)">3</button>
              <button class="demo-btn active" data-level="4" onclick="setLevel(4)">4</button>
            </div>
            <div class="demo-breadcrumb-container">
              <nav class="breadcrumbs" id="demo-breadcrumb" aria-label="Demo Breadcrumb"></nav>
            </div>

            <div class="demo-controls" style="margin-top: 4px">
              <span class="demo-label">Custom:</span>
              <input
                type="text"
                id="demo-input"
                placeholder="e.g. Dashboard / Settings / Profile"
                style="
                  flex: 1;
                  padding: 6px 12px;
                  font-family: var(--family-font-family-default);
                  font-size: 12px;
                  border: 1px solid #e5e7eb;
                  border-radius: 8px;
                  outline: none;
                  color: #374151;
                  transition: border-color 0.2s;
                "
                onfocus="this.style.borderColor = '#6366F1'"
                onblur="this.style.borderColor = '#E5E7EB'"
                onkeyup="renderCustomBreadcrumb(this.value)"
              />
            </div>
            <div
              class="demo-breadcrumb-container"
              id="custom-breadcrumb-container"
              style="display: none"
            >
              <nav class="breadcrumbs" id="custom-breadcrumb" aria-label="Custom Breadcrumb"></nav>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const homeSvg = `<svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M1.5 5.26L6 1.5L10.5 5.26V9.5C10.5 9.76522 10.3946 10.0196 10.2071 10.2071C10.0196 10.3946 9.76522 10.5 9.5 10.5H2.5C2.23478 10.5 1.98043 10.3946 1.79289 10.2071C1.60536 10.0196 1.5 9.76522 1.5 9.5V5.26Z" stroke="#6A7282" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4.5 10.5V6H7.5V10.5" stroke="#6A7282" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

      const defaultPages = ['Dashboard', 'Settings', 'Users', 'Profile'];

      function createBreadcrumbHTML(items) {
        let html = `<span class="breadcrumbs-home-icon">${homeSvg}</span>`;
        items.forEach((item, index) => {
          const isLast = index === items.length - 1;
          html += `<span class="breadcrumb-separator">/</span>`;
          if (isLast) {
            html += `<span class="breadcrumb-item-active">
          <span class="breadcrumb-item-label">${item.toUpperCase()}</span>
        </span>`;
          } else {
            html += `<a class="breadcrumb-item">
          <span class="breadcrumb-item-label">${item.toUpperCase()}</span>
        </a>`;
          }
        });
        return html;
      }

      function setLevel(level) {
        document.querySelectorAll('.demo-controls .demo-btn[data-level]').forEach((btn) => {
          btn.classList.toggle('active', parseInt(btn.dataset.level) === level);
        });
        const items = defaultPages.slice(0, level);
        document.getElementById('demo-breadcrumb').innerHTML = createBreadcrumbHTML(items);
      }

      function renderCustomBreadcrumb(value) {
        const container = document.getElementById('custom-breadcrumb-container');
        const nav = document.getElementById('custom-breadcrumb');
        if (!value.trim()) {
          container.style.display = 'none';
          return;
        }
        container.style.display = 'block';
        const items = value
          .split('/')
          .map((s) => s.trim())
          .filter(Boolean);
        if (items.length === 0) {
          container.style.display = 'none';
          return;
        }
        nav.innerHTML = createBreadcrumbHTML(items);
      }

      // Initialize with Level 4
      setLevel(4);
    </script>
  </body>
</html>
